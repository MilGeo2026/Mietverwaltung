<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mietverwaltung</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Mietverwaltung</h1>
    <button id="logout-btn" hidden>Abmelden</button>
  </header>

  <main>
    <section id="auth-section">
      <h2>Anmelden</h2>
      <form id="auth-form">
        <label>
          E-Mail
          <input type="email" id="email" required autocomplete="email" />
        </label>
        <label>
          Passwort
          <input type="password" id="password" required autocomplete="current-password" />
        </label>
        <div class="auth-actions">
          <button type="submit" data-action="login">Anmelden</button>
          <button type="button" data-action="signup">Registrieren</button>
        </div>
        <p id="auth-message" class="message"></p>
      </form>
    </section>

    <section id="app-section" hidden>
      <h2>Meine Immobilien</h2>
      <form id="property-form">
        <input type="text" id="property-name" placeholder="Name (z.B. Musterstraße 1)" required />
        <input type="text" id="property-address" placeholder="Adresse" />
        <button type="submit">Immobilie hinzufügen</button>
      </form>
      <p id="app-message" class="message"></p>
      <ul id="property-list"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
